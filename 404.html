<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Redirecting...</title>
    <script>
    (function() {
        var path = window.location.pathname;
        // Match /{optional_base}/profile/uid-{number}
        var match = path.match(/^(.*?)\/profile\/uid-(\d+)$/);
        if (match) {
            var base = match[1]; // e.g. /NB or ""
            fetch(base + '/profile.html', { credentials: 'same-origin' })
                .then(function(response) {
                    if (!response.ok) throw new Error('Profile fallback failed');
                    return response.text();
                })
                .then(function(html) {
                    var baseHref = (base || '') + '/';
                    html = html.replace(/<head([^>]*)>/i, '<head$1><base href="' + baseHref.replace(/"/g, '&quot;') + '">');
                    document.open();
                    document.write(html);
                    document.close();
                })
                .catch(function() {
                    window.location.replace(base + '/');
                });
            return;
        }
        // Fallback: strip everything and go home
        var home = path.split('/').slice(0, 2).join('/') || '/';
        window.location.replace(home + '/');
    })();
    </script>
</head>
<body>Redirecting...</body>
</html>
