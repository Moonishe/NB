    <script type="module">
        const canvas = document.getElementById('ascii-canvas');
        const ctx = canvas.getContext('2d');
        let width, height, columns, rows;
        const fontSize = window.innerWidth < 768 ? 24 : 15;
        const chars = " .:-=+*#%@".split("");

        function init() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            columns = Math.ceil(width / fontSize);
            rows = Math.ceil(height / fontSize);
        }

        let mouse = { x: -1000, y: -1000 };
        window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });

        function drawASCII(time) {
            ctx.fillStyle = '#050505';
            ctx.fillRect(0, 0, width, height);
            ctx.font = fontSize + 'px "Geist Mono"';
            ctx.textAlign = 'center';
            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < columns; x++) {
                    const charX = x * fontSize;
                    const charY = y * fontSize;
                    const dist = Math.hypot(charX - mouse.x, charY - mouse.y);
                    const mouseEffect = Math.max(0, 1 - dist / 400);
                    const noise = Math.sin(x * 0.3 + time * 0.0005) * Math.cos(y * 0.3 + time * 0.0005);
                    const brightness = Math.min(chars.length - 1, Math.floor((noise * 0.5 + 0.5 + mouseEffect * 0.7) * chars.length));
                    ctx.fillStyle = `rgba(255, 255, 255, ${0.03 + mouseEffect * 0.12})`;
                    ctx.fillText(chars[brightness], charX, charY);
                }
            }
            requestAnimationFrame(drawASCII);
        }
        init();
        window.addEventListener('resize', init);
        requestAnimationFrame(drawASCII);
    </script>
